<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>YC Scraper</title>
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen py-8 font-sans">
  <div class="max-w-7xl mx-auto px-4">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900 mb-1">YC Company Scraper</h1>
      <p class="text-sm text-gray-500">Extract company information from Y Combinator batches</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-1 space-y-4">
        <div class="bg-white p-5 rounded-lg border border-gray-200">
          <h2 class="text-lg font-semibold mb-3 text-gray-800">Controls</h2>
          <form id="scrapeForm" class="space-y-3">
            <div>
              <label for="batchInput" class="block text-sm font-medium text-gray-700 mb-1">YC Batch</label>
              <input
                name="batch"
                id="batchInput"
                placeholder="e.g. Spring 2025, Summer 2024"
                class="w-full p-2.5 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                required
              />
            </div>
            <button
              id="scrapeButton"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-md text-sm disabled:opacity-50 disabled:cursor-not-allowed"
              type="submit"
            >
              Start Scraping
            </button>
          </form>
        </div>

        <div id="progressPanel" class="bg-white rounded-lg border border-gray-200 hidden">
          <div class="p-5">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-lg font-semibold text-gray-800">Progress</h2>
              <span id="elapsedTime" class="text-xs text-gray-400 font-mono"></span>
            </div>

            <div id="phaseSteps" class="space-y-3 mb-5">
              <div data-phase="1" class="flex items-start gap-3">
                <div class="phase-icon mt-0.5 w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center flex-shrink-0">
                  <span class="phase-number text-xs font-medium text-gray-400">1</span>
                  <svg class="phase-check hidden w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                  <svg class="phase-spinner hidden w-3.5 h-3.5 text-blue-600 spinner" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                </div>
                <div class="min-w-0">
                  <p class="phase-label text-sm font-medium text-gray-400">Discover Companies</p>
                  <p class="phase-detail text-xs text-gray-400 mt-0.5 truncate"></p>
                </div>
              </div>
              <div data-phase="2" class="flex items-start gap-3">
                <div class="phase-icon mt-0.5 w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center flex-shrink-0">
                  <span class="phase-number text-xs font-medium text-gray-400">2</span>
                  <svg class="phase-check hidden w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                  <svg class="phase-spinner hidden w-3.5 h-3.5 text-blue-600 spinner" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                </div>
                <div class="min-w-0">
                  <p class="phase-label text-sm font-medium text-gray-400">Extract Data</p>
                  <p class="phase-detail text-xs text-gray-400 mt-0.5 truncate"></p>
                </div>
              </div>
              <div data-phase="3" class="flex items-start gap-3">
                <div class="phase-icon mt-0.5 w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center flex-shrink-0">
                  <span class="phase-number text-xs font-medium text-gray-400">3</span>
                  <svg class="phase-check hidden w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                  <svg class="phase-spinner hidden w-3.5 h-3.5 text-blue-600 spinner" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                </div>
                <div class="min-w-0">
                  <p class="phase-label text-sm font-medium text-gray-400">Save to Sheets</p>
                  <p class="phase-detail text-xs text-gray-400 mt-0.5 truncate"></p>
                </div>
              </div>
            </div>

            <div id="progressBarContainer" class="hidden">
              <div class="flex items-center justify-between mb-1.5">
                <span id="progressLabel" class="text-xs font-medium text-gray-600">0 / 0</span>
                <span id="progressPct" class="text-xs font-medium text-gray-600">0%</span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-2">
                <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
              </div>
              <div id="etaRow" class="flex items-center justify-between mt-1.5 hidden">
                <span class="text-xs text-gray-400">ETA</span>
                <span id="etaText" class="text-xs text-gray-500 font-mono"></span>
              </div>
            </div>
          </div>

          <div id="activityLog" class="border-t border-gray-200 hidden">
            <div class="px-5 py-3">
              <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Activity</h3>
              <div id="logEntries" class="space-y-1 max-h-32 overflow-y-auto text-xs" role="log" aria-live="polite"></div>
            </div>
          </div>

          <div id="errorPanel" class="border-t border-gray-200 hidden">
            <div class="px-5 py-3">
              <h3 class="text-xs font-semibold text-red-500 uppercase tracking-wide mb-2">Errors (<span id="errorCount">0</span>)</h3>
              <div id="errorEntries" class="space-y-1 max-h-24 overflow-y-auto text-xs"></div>
            </div>
          </div>

          <div id="resultBanner" class="hidden"></div>
        </div>
      </div>

      <div class="lg:col-span-2">
        <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
          <div class="bg-gray-50 border-b border-gray-200 px-5 py-3">
            <div class="flex items-center justify-between flex-wrap gap-3">
              <div>
                <h2 class="text-lg font-semibold text-gray-800">Company Data</h2>
                <p class="text-xs text-gray-500">Live view of extracted company information</p>
              </div>
              <div class="flex gap-2">
                <a
                  href="https://docs.google.com/spreadsheets/d/1jFLtlpbTBKzSEsThdD9tfP8AQr-_TIPOrVWMjr_Zl50/edit?usp=sharing"
                  target="_blank"
                  class="inline-flex items-center px-3 py-1.5 text-xs font-medium text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-md border border-blue-200"
                >
                  Open in Google Sheets
                </a>
                <button
                  onclick="document.getElementById('spreadsheetFrame').src = document.getElementById('spreadsheetFrame').src"
                  class="inline-flex items-center px-3 py-1.5 text-xs font-medium text-gray-600 bg-white border border-gray-300 rounded-md hover:bg-gray-50"
                >
                  Refresh
                </button>
              </div>
            </div>
          </div>
          <div class="relative" style="height: 700px;">
            <iframe
              id="spreadsheetFrame"
              src="https://docs.google.com/spreadsheets/d/1jFLtlpbTBKzSEsThdD9tfP8AQr-_TIPOrVWMjr_Zl50/edit?usp=sharing&rm=minimal"
              class="w-full h-full border-0"
              title="Company Data Spreadsheet"
            ></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('scrapeForm');
    const scrapeButton = document.getElementById('scrapeButton');
    const progressPanel = document.getElementById('progressPanel');
    const progressBarContainer = document.getElementById('progressBarContainer');
    const progressBar = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');
    const progressPct = document.getElementById('progressPct');
    const etaRow = document.getElementById('etaRow');
    const etaText = document.getElementById('etaText');
    const elapsedTime = document.getElementById('elapsedTime');
    const activityLog = document.getElementById('activityLog');
    const logEntries = document.getElementById('logEntries');
    const errorPanel = document.getElementById('errorPanel');
    const errorCount = document.getElementById('errorCount');
    const errorEntries = document.getElementById('errorEntries');
    const resultBanner = document.getElementById('resultBanner');

    let isScrapingActive = false;
    let pollInterval = null;
    let startTimestamp = null;
    let elapsedInterval = null;
    let lastSeenItems = [];
    let lastSeenErrors = [];

    function formatDuration(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m > 0 ? `${m}m ${s}s` : `${s}s`;
    }

    function startElapsedTimer() {
      startTimestamp = Date.now();
      elapsedInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTimestamp) / 1000);
        elapsedTime.textContent = formatDuration(elapsed);
      }, 1000);
    }

    function stopElapsedTimer() {
      if (elapsedInterval) clearInterval(elapsedInterval);
    }

    function setPhaseState(phaseNum, state) {
      const el = document.querySelector(`[data-phase="${phaseNum}"]`);
      if (!el) return;
      const icon = el.querySelector('.phase-icon');
      const num = el.querySelector('.phase-number');
      const check = el.querySelector('.phase-check');
      const spinner = el.querySelector('.phase-spinner');
      const label = el.querySelector('.phase-label');

      num.classList.add('hidden');
      check.classList.add('hidden');
      spinner.classList.add('hidden');

      if (state === 'pending') {
        icon.className = 'phase-icon mt-0.5 w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center flex-shrink-0';
        num.classList.remove('hidden');
        label.className = 'phase-label text-sm font-medium text-gray-400';
      } else if (state === 'active') {
        icon.className = 'phase-icon mt-0.5 w-6 h-6 rounded-full border-2 border-blue-500 bg-blue-50 flex items-center justify-center flex-shrink-0';
        spinner.classList.remove('hidden');
        label.className = 'phase-label text-sm font-medium text-gray-900';
      } else if (state === 'done') {
        icon.className = 'phase-icon mt-0.5 w-6 h-6 rounded-full border-2 border-green-500 bg-green-500 flex items-center justify-center flex-shrink-0';
        check.classList.remove('hidden');
        label.className = 'phase-label text-sm font-medium text-green-700';
      } else if (state === 'error') {
        icon.className = 'phase-icon mt-0.5 w-6 h-6 rounded-full border-2 border-red-400 bg-red-50 flex items-center justify-center flex-shrink-0';
        num.classList.remove('hidden');
        num.className = 'phase-number text-xs font-medium text-red-500';
        label.className = 'phase-label text-sm font-medium text-red-600';
      }
    }

    function setPhaseDetail(phaseNum, text) {
      const el = document.querySelector(`[data-phase="${phaseNum}"]`);
      if (!el) return;
      el.querySelector('.phase-detail').textContent = text || '';
    }

    function addLogEntry(text) {
      const entry = document.createElement('div');
      entry.className = 'text-gray-600 py-0.5';
      entry.textContent = text;
      logEntries.appendChild(entry);
      logEntries.scrollTop = logEntries.scrollHeight;
      activityLog.classList.remove('hidden');
    }

    function showResult(type, message) {
      if (type === 'success') {
        resultBanner.className = 'p-4 bg-green-50 border-t border-green-200 text-sm text-green-800 font-medium';
      } else {
        resultBanner.className = 'p-4 bg-red-50 border-t border-red-200 text-sm text-red-800 font-medium';
      }
      resultBanner.textContent = message;
      resultBanner.classList.remove('hidden');
    }

    function resetUI() {
      progressPanel.classList.add('hidden');
      progressBarContainer.classList.add('hidden');
      etaRow.classList.add('hidden');
      activityLog.classList.add('hidden');
      errorPanel.classList.add('hidden');
      resultBanner.classList.add('hidden');
      logEntries.innerHTML = '';
      errorEntries.innerHTML = '';
      progressBar.style.width = '0%';
      elapsedTime.textContent = '';
      lastSeenItems = [];
      lastSeenErrors = [];
      for (let i = 1; i <= 3; i++) {
        setPhaseState(i, 'pending');
        setPhaseDetail(i, '');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isScrapingActive) return;

      isScrapingActive = true;
      resetUI();
      scrapeButton.disabled = true;
      scrapeButton.textContent = 'Scraping...';
      progressPanel.classList.remove('hidden');
      setPhaseState(1, 'active');
      setPhaseDetail(1, 'Starting...');
      startElapsedTimer();

      try {
        const response = await fetch('/start', {
          method: 'POST',
          body: new FormData(form)
        });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.message || 'Failed to start scraping');
        }
        startPolling();
      } catch (error) {
        isScrapingActive = false;
        scrapeButton.disabled = false;
        scrapeButton.textContent = 'Start Scraping';
        stopElapsedTimer();
        setPhaseState(1, 'error');
        setPhaseDetail(1, error.message);
        showResult('error', error.message);
      }
    });

    function startPolling() {
      pollInterval = setInterval(async () => {
        try {
          const response = await fetch('/progress');
          const data = await response.json();
          handleProgressUpdate(data);
        } catch (error) {
          console.error('Polling error:', error);
        }
      }, 1000);
    }

    function handleProgressUpdate(data) {
      const { processed, total, errors, status, phase, phase_name, phase_message, recent_items, error_details, start_time } = data;
      const currentPhase = phase || 0;

      for (let i = 1; i <= 3; i++) {
        if (i < currentPhase) {
          setPhaseState(i, 'done');
        } else if (i === currentPhase) {
          if (status === 'failed') {
            setPhaseState(i, 'error');
          } else if (status === 'completed') {
            setPhaseState(i, 'done');
          } else {
            setPhaseState(i, 'active');
          }
        } else {
          setPhaseState(i, 'pending');
        }
      }

      if (phase_message) {
        setPhaseDetail(currentPhase, phase_message);
      }

      if (currentPhase === 2 && total > 1) {
        progressBarContainer.classList.remove('hidden');
        const pct = Math.round((processed / total) * 100);
        progressBar.style.width = pct + '%';
        progressLabel.textContent = `${processed} / ${total}`;
        progressPct.textContent = pct + '%';

        if (processed > 0 && processed < total && start_time) {
          const elapsedSec = (Date.now() / 1000) - start_time;
          const rate = processed / elapsedSec;
          const remaining = (total - processed) / rate;
          etaRow.classList.remove('hidden');
          etaText.textContent = '~' + formatDuration(remaining);
        }
      } else {
        progressBarContainer.classList.add('hidden');
      }

      if (recent_items && recent_items.length > 0) {
        const newItems = recent_items.filter(item => !lastSeenItems.includes(item));
        newItems.forEach(item => addLogEntry('Extracted: ' + item));
        lastSeenItems = [...recent_items];
      }

      if (error_details && error_details.length > 0) {
        const newErrors = error_details.filter(err => !lastSeenErrors.includes(err));
        if (newErrors.length > 0) {
          errorPanel.classList.remove('hidden');
          newErrors.forEach(err => {
            const entry = document.createElement('div');
            entry.className = 'text-red-600 py-0.5';
            entry.textContent = err;
            errorEntries.appendChild(entry);
          });
          lastSeenErrors = [...error_details];
        }
        errorCount.textContent = errors.toString();
      }

      if (status === 'completed') {
        clearInterval(pollInterval);
        stopElapsedTimer();
        isScrapingActive = false;
        scrapeButton.disabled = false;
        scrapeButton.textContent = 'Start New Scrape';
        for (let i = 1; i <= 3; i++) setPhaseState(i, 'done');
        setPhaseDetail(3, 'Done!');
        const msg = errors > 0
          ? `Completed with ${errors} error(s). ${processed} companies saved to spreadsheet.`
          : `All ${processed} companies saved to spreadsheet.`;
        showResult('success', msg);
      }

      if (status === 'failed') {
        clearInterval(pollInterval);
        stopElapsedTimer();
        isScrapingActive = false;
        scrapeButton.disabled = false;
        scrapeButton.textContent = 'Retry';
        showResult('error', 'Scraping failed. Check errors below for details.');
      }
    }
  </script>
</body>
</html>
